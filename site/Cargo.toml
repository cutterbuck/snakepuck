[package]
name = "snakepuck"
version = "0.1.0"
edition = "2024"

# One crate, two builds (cargo-leptos runs both):
#   ssr      the server: Axum API + server-rendered pages + the data layer
#   hydrate  the browser: the same pages compiled to WASM, made interactive
# The data layer and everything that reads HALO data is ssr-only, so it can never be
# compiled into the WASM bundle.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "snakepuck"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Shared
leptos = "0.8.22"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7"

# Server (ssr)
anyhow = { version = "1.0.104", optional = true }
arrow = { version = "60.0.0", default-features = false, features = ["json"], optional = true }
axum = { version = "0.8.9", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "snap"], optional = true }
quick_cache = { version = "0.7.0", optional = true }
serde_arrow = { version = "0.15.1", features = ["arrow-60"], optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br"], optional = true }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

# Browser (hydrate)
console_error_panic_hook = { version = "0.1", optional = true }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:anyhow",
    "dep:arrow",
    "dep:axum",
    "dep:leptos_axum",
    "dep:parquet",
    "dep:quick_cache",
    "dep:serde_arrow",
    "dep:tokio",
    "dep:tower-http",
    "dep:tower_governor",
    "dep:tracing",
    "dep:tracing-subscriber",
]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:gloo-net",
    "dep:wasm-bindgen",
]

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Small WASM bundle for production.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "snakepuck"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
