[package]
name = "snakepuck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = false }
axum = "0.8.9"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "snap"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_arrow = { version = "0.15.1", features = ["arrow-60"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
