# Cloud Run service for the API, applied by .github/workflows/site.yml with
# `gcloud run services replace` (${IMAGE} is filled in at deploy time).
#
# The data is mounted read-only from snakepuck-serving-use4, a copy of the serving export
# in this service's region (dbt.yml syncs it after each export). Reading the us-central1
# original from here doubled the startup load of the marts (about 1.5 s -> 3.5 s) and
# slowed each game's first open. Only serving/prod is visible.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: snakepuck-api
  labels:
    # N. Virginia, near the East Coast visitors; 15-33 ms faster per request from NYC than
    # us-central1, through Firebase (measured 2026-10-28). The data bucket and images stay
    # in us-central1; the marts load across regions only at startup.
    cloud.googleapis.com/location: us-east4
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2 # required for Cloud Storage volumes
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "0" # scale to zero: $0 when idle, cold starts
        autoscaling.knative.dev/maxScale: "2" # cost cap; rate limits are per instance
    spec:
      serviceAccountName: snakepuck-api@snakepuck.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            # Firebase Hosting (snakepuck.com) sends X-Forwarded-For as "<client>, <Firebase
            # edge>", so the client is one entry from the end. Measured 2026-10-28; see
            # infra/README.md. Direct requests to the run.app URL can pick their own key.
            - name: TRUSTED_PROXY_HOPS
              value: "1"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: snakepuck-serving-use4
              mountOptions: only-dir=serving/prod
