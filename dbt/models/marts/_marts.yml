version: 2

models:
  - name: dim_games
    description: One row per game.
    columns:
      - name: game_id
        data_tests: [unique, not_null]

  - name: dim_players
    description: One row per player.
    columns:
      - name: player_id
        data_tests: [unique, not_null]
      - name: full_name
        data_tests: [not_null]

  - name: dim_teams
    description: One row per team, with HALO's team id. Teams with no games are dropped.
    columns:
      - name: team_abbr
        data_tests: [unique, not_null]
      - name: source_team_id
        # Unique also catches two abbreviations mapped to one HALO team.
        data_tests: [unique, not_null]

  - name: fct_stints
    description: One row per player per stint, with stats split by game situation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, game_stint, player_id]
      - matches_golden:
          config:
            enabled: "{{ var('legacy_parity') }}"
            store_failures: true # mismatched rows land in *_dbt_test__audit for inspection
          arguments:
            golden: source('golden', 'stints')
            keys: [game_id, game_stint, player_id]

  - name: fct_player_game_stats
    description: One row per player per game per team.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, game_id, team_abbr]
      - matches_golden:
          config:
            enabled: "{{ var('legacy_parity') }}"
            store_failures: true # mismatched rows land in *_dbt_test__audit for inspection
          arguments:
            golden: source('golden', 'player_game_stats')
            keys: [player_id, game_id, team_abbr]

  - name: fct_player_season_stats
    description: One row per player per team per season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, team_abbr, season]
      - matches_golden:
          config:
            enabled: "{{ var('legacy_parity') }}"
            store_failures: true # mismatched rows land in *_dbt_test__audit for inspection
          arguments:
            golden: source('golden', 'player_stats')
            keys: [player_id, team_abbr, season]
            # One-decimal averages: an exact .x5 tie rounds either way depending
            # on floating-point summation order, which differs from Python's.
            column_tolerance: {tot_atoi: 0.11, es_atoi: 0.11, ev5_atoi: 0.11, pp_atoi: 0.11, pk_atoi: 0.11}

  - name: fct_team_season_stats
    description: Standings, one row per team per season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [team_abbr, season]
      - matches_golden:
          config:
            enabled: "{{ var('legacy_parity') }}"
            store_failures: true # mismatched rows land in *_dbt_test__audit for inspection
          arguments:
            golden: source('golden', 'team_stats')
            keys: [team_abbr, season]

  - name: fct_shifts
    description: One row per skater shift (consecutive stints with no gap). Goalies have none.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, player_id, shift]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_time_end > period_time_start"

  - name: fct_game_events
    description: One row per event, with the fields the game-report rink displays.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, sl_event_id]

  - name: fct_tracking_snapshots
    description: >
      Skater positions at each event, one row per skater per event, with the
      event's clock time, team, and display name ("Unidentified (<team>)" when
      HALO couldn't identify the skater).
    # Uniqueness is tested once, on stg_halo__tracking (this table is a 1:1 subset);
    # the null checks share one scan of this 13.5M-row table.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "team_abbr is not null and display_name is not null and period_time is not null"
