name: snakepuck
version: "1.0.0"
profile: snakepuck

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

vars:
  # true: reproduce the old Python pipeline exactly, bugs included, and run the
  # matches_golden reconciliation tests (dbt build --vars 'legacy_parity: true').
  # false: apply the bug fixes documented in docs/MIGRATION_PLAN.md.
  legacy_parity: false

models:
  snakepuck:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  snakepuck:
    +schema: reference
