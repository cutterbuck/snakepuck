name: snakepuck
version: "1.0.0"
profile: snakepuck

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

models:
  snakepuck:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

data_tests:
  snakepuck:
    +store_failures: true # failing rows are saved to *_dbt_test__audit for inspection

seeds:
  snakepuck:
    +schema: reference
