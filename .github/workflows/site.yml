name: site

# Checks the Rust API (site/) when it changes: formatting, lints, and tests.
# On main, then builds the image and deploys it to Cloud Run (site/service.yaml).
# Tests build their data in memory; licensed HALO data never enters CI or the image.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # keyless GCP auth (Workload Identity Federation)
    env:
      IMAGE: us-central1-docker.pkg.dev/snakepuck/snakepuck/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/65985276875/locations/global/workloadIdentityPools/github/providers/snakepuck-repo
          service_account: snakepuck-pipeline@snakepuck.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          envsubst '${IMAGE}' < site/service.yaml > service.yaml
          gcloud run services replace service.yaml --region=us-central1 --project=snakepuck --quiet
